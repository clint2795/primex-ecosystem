<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PrimeX Finance HQ · Customer Job</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--font:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--accent:#b9ddff;--accent-strong:#6fb9ff;--rail:232px;--r:11px}html[data-theme=dark]{--bg:#080b10;--top:#0c1016;--surface:#111720;--raised:#151d28;--text:#fbfcfe;--muted:#c8d0da;--quiet:#99a5b4;--line:#2b3542;--line-soft:#1e2732;--accent-soft:rgba(111,185,255,.15);--button-top:#c7e6ff;--button-bottom:#91caff;--button-text:#07101b}html[data-theme=light]{--bg:#f5f6f8;--top:#fff;--surface:#fff;--raised:#fafbfc;--text:#171a20;--muted:#5f6772;--quiet:#818a96;--line:#d9dee5;--line-soft:#e9edf2;--accent-soft:rgba(37,95,214,.08);--button-top:#3472e4;--button-bottom:#255fd6;--button-text:#fff}*{box-sizing:border-box;min-width:0}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}body{font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}button{font-family:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:2px solid var(--accent-strong);outline-offset:3px}.app{min-height:100vh;padding-bottom:84px}.topbar{height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:var(--top);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:20}.brand{display:flex;gap:10px;align-items:center}.mark{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--accent);font-weight:700;background:var(--surface)}.top-back{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:650;padding:8px 0}.content{max-width:980px;margin:0 auto;padding:20px 18px 44px}.page-head{margin-bottom:20px}.page-kicker{color:var(--accent-strong);font-size:12px;font-weight:700;letter-spacing:.075em;text-transform:uppercase}.page-title{margin:5px 0 0;color:var(--text);font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.15}.page-ref{margin-top:5px;color:var(--quiet);font-size:14px}.page-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:9px;color:var(--muted);font-size:14px}.desktop-back{display:none}.stage-line{margin:0 0 9px;color:var(--accent);font-size:14px;font-weight:650}.lifecycle{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:0 0 22px;position:relative}.lifecycle:before{content:"";position:absolute;left:7%;right:7%;top:11px;height:1px;background:var(--line);z-index:0}.life-step{position:relative;z-index:1;text-align:center}.life-dot{width:22px;height:22px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--quiet);font-size:10px;font-weight:700}.life-step.done .life-dot{border-color:color-mix(in srgb,var(--accent-strong) 45%,var(--line));background:var(--surface);color:var(--accent)}.life-step.active .life-dot{border-color:var(--accent-strong);background:var(--accent-soft);color:var(--accent)}.life-label{font-size:9.5px;color:var(--quiet);font-weight:600;white-space:nowrap}.life-step.active .life-label{color:var(--text)}.record-layout{display:flex;flex-direction:column;gap:28px}.record-section{min-width:0}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:9px}.section-title h2{margin:0;font-size:18px}.section-title span{color:var(--quiet);font-size:14px}.panel{border:1px solid color-mix(in srgb,var(--accent-strong) 8%,var(--line));background:var(--surface);border-radius:var(--r);padding:13px 15px}.factrow,.stockline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}.factrow:first-child{padding-top:0}.factrow:last-child,.stockline:last-child{border-bottom:0;padding-bottom:0}.factrow span,.stockline span{color:var(--quiet);font-size:14px;font-weight:600}.factrow strong,.stockline strong{font-size:15px;text-align:right;overflow-wrap:anywhere}.context-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);font-weight:700}.requestline{margin-top:4px;font-size:17px;font-weight:700}.requestmeta{margin-top:4px;color:var(--muted);font-size:14px}.next{border:1px solid color-mix(in srgb,var(--accent-strong) 20%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--raised) 95%,var(--accent) 5%),var(--surface));border-radius:var(--r);padding:13px 15px 14px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}.nexttitle{margin-top:3px;font-size:20px;font-weight:700}.nextsub{margin-top:3px;color:var(--muted);font-size:14px;line-height:1.5}.btn{border-radius:8px;padding:10px 13px;font-size:15px;font-weight:700}.primary{margin-top:10px;border:1px solid color-mix(in srgb,var(--button-bottom) 82%,#fff);background:linear-gradient(180deg,var(--button-top),var(--button-bottom));color:var(--button-text)}.primary:disabled{opacity:.55;cursor:not-allowed}.waiting{padding:13px 15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.waiting strong{display:block;font-size:18px}.waiting span{display:block;margin-top:3px;color:var(--muted);font-size:14px}.history-link{display:flex;justify-content:space-between;gap:14px;align-items:center;width:100%;text-align:left;color:var(--text);font-size:16px}.history-link strong{font-size:17px}.history-link span{color:var(--quiet);font-size:14px}.sidebar{display:none}.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--top) 97%,transparent);border-top:1px solid var(--line-soft);backdrop-filter:blur(16px);z-index:30}.bottom button{border:0;background:transparent;color:var(--quiet);padding:9px 2px;border-radius:7px;font-size:13px;font-weight:600}.bottom button.active{background:var(--accent-soft);color:var(--text)}.sidebar-nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:8px;font-weight:600}.sidebar-nav button.active{background:var(--accent-soft);color:var(--text)}@media(max-width:420px){.content{padding-left:16px;padding-right:16px}.life-label{font-size:8.7px}.page-title{font-size:25px}.factrow strong,.stockline strong{font-size:14px}}@media(min-width:860px){.app{padding-left:var(--rail);padding-bottom:0}.sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--top);border-right:1px solid var(--line-soft);padding:16px 12px;flex-direction:column}.side-brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px}.sidebar-nav{display:grid;gap:4px}.topbar,.bottom{display:none}.content{max-width:1340px;padding:30px 36px 60px}.desktop-back{display:inline-flex;align-items:center;gap:7px;margin-bottom:24px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:0}.desktop-back:hover{color:var(--text)}.page-head{margin-bottom:24px}.page-title{font-size:31px}.page-ref,.page-meta{font-size:15px}.stage-line{margin-bottom:12px}.lifecycle{max-width:100%;margin-bottom:30px}.life-label{font-size:12px}.life-dot{width:26px;height:26px;font-size:11px;margin-bottom:7px}.lifecycle:before{top:13px}.record-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);column-gap:32px;row-gap:30px;align-items:start}.record-main{grid-column:1}.record-support{grid-column:2;grid-row:1 / span 2;display:grid;gap:28px}.record-position{grid-column:1}.record-history{grid-column:1 / -1}.record-history .panel{width:100%}.section-title h2{font-size:19px}.panel{padding:17px 20px}.factrow,.stockline{padding:11px 0}.next{padding:18px 20px}.nexttitle{font-size:22px}.nextsub{font-size:15px}.record-main{display:grid;gap:28px}.record-support .record-section{margin:0}.record-position{margin-top:0}}
</style></head><body><div class="app"><aside class="sidebar"><div class="side-brand"><div class="mark">PX</div><strong>Finance HQ</strong></div><nav class="sidebar-nav"><button>Start</button><button>Requests</button><button class="active" onclick="location.href='../finance-operator-v2-customer-jobs-proof/'">Customer Jobs</button><button>Orders</button><button>Stock</button><button>Payments</button><button>Admin</button></nav></aside><header class="topbar"><div class="brand"><div class="mark">PX</div><strong>Finance HQ</strong></div><button class="top-back" onclick="goJobs()">← Customer Jobs</button></header><main class="content"><button class="desktop-back" onclick="goJobs()">← Customer Jobs</button><div id="workspace"></div></main><nav class="bottom"><button>Start</button><button>Requests</button><button class="active" onclick="goJobs()">Jobs</button><button>Stock</button><button>More</button></nav></div>
<script>
const steps=['Request','Quote','Accepted','Payment','Fulfilment','Complete'];
const states={
ready:{idx:0,stage:'Request · Stage 1 of 6',ref:'PX-DEMO-JOB-01',mainTitle:'Customer request',time:'Today 17:34',main:`<div class="panel"><div class="context-label">Requested</div><div class="requestline">BPC-157 10mg × 2</div><div class="requestmeta">Fully covered by current stock.</div><div class="stockline"><span>Available now</span><strong>8</strong></div><div class="stockline"><span>Short</span><strong>0</strong></div></div>`,action:`<section class="next"><div class="eyebrow">Next action</div><div class="nexttitle">Draft customer quote</div><div class="nextsub">Create the quote from this request using the approved commercial authority.</div><button class="btn primary" disabled title="Preview only — commercial actions are not connected">Create quote</button></section>`,current:[['Requested','BPC-157 10mg × 2'],['Stock position','8 available · 0 short'],['Availability','Available now'],['Quote','Not created yet']],communication:[['Message status','Not sent yet'],['Next communication','Quote']],events:'1 event →'},
'quote-ready':{idx:1,stage:'Quote · Stage 2 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Quote ready',time:'Today 17:41',main:`<div class="panel">${[['Quote','Q-1048'],['Items','BPC-157 10mg × 2'],['Total','£80.00'],['Availability','Available now']].map(x=>`<div class="factrow"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>`,action:`<section class="next"><div class="eyebrow">Next action</div><div class="nexttitle">Send customer quote</div><div class="nextsub">The quote is ready. Send the approved customer message using the current quote facts.</div><button class="btn primary" disabled title="Preview only — messaging is not connected">Send quote</button></section>`,current:[['Quote status','Ready to send'],['Customer reply','Prepared'],['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Ready'],['Next communication','Send quote']],events:'2 events →'},
'quote-sent':{idx:1,stage:'Quote · Stage 2 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Quote sent',time:'Today 17:44',main:`<div class="panel">${[['Quote','Q-1048'],['Total','£80.00'],['Sent via','WhatsApp'],['Sent at','17:44']].map(x=>`<div class="factrow"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>`,action:`<section class="waiting"><strong>Waiting for customer</strong><span>No action is needed until the customer replies or accepts the quote.</span></section>`,current:[['Quote status','Sent'],['Customer','Awaiting reply'],['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Sent'],['Next communication','After customer response']],events:'3 events →'},
accepted:{idx:2,stage:'Accepted · Stage 3 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Quote accepted',time:'Today 17:52',main:`<div class="panel">${[['Quote','Q-1048'],['Accepted total','£80.00'],['Accepted via','WhatsApp'],['Accepted at','17:52']].map(x=>`<div class="factrow"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>`,action:`<section class="next"><div class="eyebrow">Next action</div><div class="nexttitle">Send payment details</div><div class="nextsub">The quote is accepted and the £80.00 total is locked. Send the approved payment message using the accepted quote facts.</div><button class="btn primary" disabled title="Preview only — messaging is not connected">Prepare payment message</button></section>`,current:[['Quote status','Accepted'],['Accepted total','£80.00 · locked'],['Payment','Awaiting'],['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Ready to prepare'],['Next communication','Payment details']],events:'4 events →'}};
const row=(a,b)=>`<div class="factrow"><span>${a}</span><strong>${b}</strong></div>`;
function goJobs(){location.href='../finance-operator-v2-customer-jobs-proof/'}
function life(i){return `<div class="lifecycle" role="img" aria-label="${steps[i]}, stage ${i+1} of 6">${steps.map((s,n)=>`<div class="life-step ${n<i?'done':''} ${n===i?'active':''}"><div class="life-dot">${n<i?'✓':n+1}</div><div class="life-label">${s}</div></div>`).join('')}</div>`}
function render(key){const s=states[key]||states.ready;document.getElementById('workspace').innerHTML=`<div class="page-head"><div class="page-kicker">Customer job</div><h1 class="page-title">Demo Customer A</h1><div class="page-ref">${s.ref}</div><div class="page-meta"><span>Preferred contact · WhatsApp</span><span>Handled by · Clint</span></div></div><div class="stage-line">${s.stage}</div>${life(s.idx)}<div class="record-layout"><div class="record-main"><section class="record-section"><div class="section-title"><h2>${s.mainTitle}</h2><span>${s.time}</span></div>${s.main}</section>${s.action}</div><div class="record-support"><section class="record-section"><div class="section-title"><h2>Customer communication</h2></div><div class="panel">${s.communication.map(x=>row(x[0],x[1])).join('')}</div></section></div><section class="record-section record-position"><div class="section-title"><h2>Current position</h2></div><div class="panel">${s.current.map(x=>row(x[0],x[1])).join('')}</div></section><section class="record-section record-history"><button class="panel history-link" disabled title="Preview only — conversation history is not connected"><strong>Conversation &amp; history</strong><span>${s.events}</span></button></section></div>`}
const key=states[location.hash.slice(1)]?location.hash.slice(1):'ready';render(key);const saved=localStorage.getItem('px-v2-theme');if(saved)document.documentElement.dataset.theme=saved;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';
</script></body></html>
