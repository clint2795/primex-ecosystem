nd:var(--accent-soft);color:var(--text)}.sidebar-nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:8px}.sidebar-nav button.active{background:var(--accent-soft);color:var(--text)}.proof-switch{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}.proof-switch button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 10px;border-radius:7px;font-size:12px;font-weight:600}.proof-switch button.active{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--text)}.proof-label{font-size:12px;color:var(--quiet);margin-bottom:7px}.record-action{order:0}.record-evidence{order:1}.record-support{order:2}.record-position{order:3}.record-history{order:4}.proof-dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:22px;max-width:440px;width:calc(100% - 32px)}.proof-dialog::backdrop{background:rgba(0,0,0,.65)}.proof-dialog h2{margin:0 0 8px;font-size:20px}.proof-dialog p{color:var(--muted);font-size:14px}.proof-dialog button{margin-top:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);padding:10px 16px;border-radius:8px}.demo-status{color:var(--quiet);font-size:13px;margin-top:10px}.data-note{margin-top:12px;color:var(--quiet);font-size:13px}.waiting .demo-note{margin-top:8px}@media(max-width:420px){.content{padding-left:16px;padding-right:16px}.life-label{font-size:8.7px}.page-title{font-size:25px}.factrow strong,.stockline strong{font-size:14px}.proof-switch button{font-size:11px;padding:7px 8px}}@media(min-width:860px){.app{padding-left:var(--rail);padding-bottom:0}.sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--top);border-right:1px solid var(--line-soft);padding:16px 12px;flex-direction:column}.side-brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px}.topbar,.bottom{display:none}.content{max-width:1340px;padding:30px 36px 6 </style></head><body><div class="app"><aside class="sidebar"><div class="side-brand"><div class="mark">PX</div><strong>Finance HQ</strong></div><nav class="sidebar-nav"><button>Start</button><button>Requests</button><button class="active" onclick="goJobs()">Customer Jobs</button><button>Orders</button><button>Stock</button><button>Payments</button><button>Admin</button></nav></aside><header class="topbar"><div class="brand"><div class="mark">PX</div><strong>Finance HQ</strong></div><button class="top-back" onclick="goJobs()">← Customer Jobs</button></header><main class="content"><button class="desktop-back" onclick="goJobs()">← Customer Jobs</button><div class="proof-label">WORKSPACE STATE PREVIEW · DEMO DATA</div><div class="proof-switch" id="proof-switch" aria-label="Preview lifecycle state"></div><div id="workspace"></div></main><nav class="bottom"><button>Start</button><button>Requests</button><button class="active" onclick="goJobs()">Jobs</button><button>Stock</button><button>More</button></nav></div><dialog class="proof-dialog" id="proof-dialog"><h2 id="dialog-title">Preview</h2><p id="dialog-copy"></p><button type="button" id="dialog-close">Close</button></dialog>
<script>
const steps=['Request','Quote','Accepted','Payment','Fulfilment','Complete'];
const row=(a,b)=>`<div class="factrow"><span>${a}</span><strong>${b}</strong></div>`;
const facts=items=>`<div class="panel">${items.map(x=>row(x[0],x[1])).join('')}</div>`;
const action=(title,sub,label)=>`<section class="next"><div class="eyebrow">Next action</div><div class="nexttitle">${title}</div><div class="nextsub">${sub}</div><button class="btn primary" type="button" data-demo-action="${label}">${label}</button><span class="demo-note">Preview only · No commercial changes</span></section>`;
const waiting=(title,sub)=>`<section class="waiting"><strong>${title}</strong><span>${sub}</span></section>`;
const states={
ready:{idx:0,stage:'Request · Stage 1 of 6',ref:'PX-DEMO-JOB-01',mainTitle:'Customer request',time:'Today 17:34',main:`<div class="panel"><div class="context-label">Requested</div><div class="requestline">BPC-157 10mg × 2</div><div class="requestmeta">Fully covered by current stock.</div><div class="stockline"><span>Available now</span><strong>8</strong></div><div class="stockline"><span>Short</span><strong>0</strong></div></div>`,action:action('Create quote','BPC-157 10mg × 2 · Available now','Create quote'),current:[['Availability','Available now'],['Quote','Not created yet']],communication:[['Message status','Not sent yet']],events:'1 event →'},
'quote-ready':{idx:1,stage:'Quote · Stage 2 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Quote ready',time:'Today 17:41',main:facts([['Quote','Q-1048'],['Items','BPC-157 10mg × 2'],['Total','£80.00'],['Availability','Available now']]),action:action('Send customer quote','Q-1048 · £80.00','Prepare message'),current:[['Quote status','Ready to send'],['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Ready']],events:'2 events →'},
'quote-sent':{idx:1,stage:'Quote · Stage 2 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Quote sent',time:'Today 17:44',main:facts([['Quote','Q-1048'],['Total','£80.00'],['Sent via','WhatsApp'],['Sent at','17:44']]),action:waiting('Waiting for customer','Awaiting a reply or acceptance.'),current:[['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Sent']],events:'3 events →'},
accepted:{idx:2,stage:'Accepted · Stage 3 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Quote accepted',time:'Today 17:52',main:facts([['Quote','Q-1048'],['Accepted total','£80.00'],['Accepted via','WhatsApp'],['Accepted at','17:52']]),action:action('Send payment details','£80.00 accepted · Payment awaiting','Prepare message'),current:[['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Ready to prepare']],events:'4 events →'},
'payment':{idx:3,stage:'Payment · Stage 4 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Payment awaiting',time:'Demo · 18:02',main:facts([['Accepted total','£80.00 · locked'],['Payment method','Bank transfer'],['Payment evidence','Not recorded'],['Balance','£80.00']]),action:action('Check payment','Bank transfer · £80.00 awaiting','Review payment'),current:[['Payment','Awaiting verification'],['Stock position','8 available · 0 short']],communication:[['Channel','WhatsApp'],['Message status','Payment details prepared']],events:'5 events →'},
'fulfilment':{idx:4,stage:'Fulfilment · Stage 5 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Ready for fulfilment',time:'Demo · 18:15',main:facts([['Payment','Verified · demo'],['Items','BPC-157 10mg × 2'],['Packing','Not started'],['Dispatch','Not recorded']]),action:action('Prepare fulfilment','2 vials · Packing and dispatch next','Open fulfilment'),current:[['Stock deduction','Pending live order authority'],['Dispatch evidence','Not recorded']],communication:[['Channel','WhatsApp'],['Message status','Dispatch update pending']],events:'6 events →'},
'complete':{idx:5,stage:'Complete · Stage 6 of 6',ref:'PX-DEMO-JOB-01 · Q-1048',mainTitle:'Job complete',time:'Demo · 18:42',main:facts([['Accepted total','£80.00 · locked'],['Payment','Verified · demo'],['Fulfilment','Complete · demo'],['Dispatch','Recorded · demo']]),action:waiting('No action required','The demonstration job is complete.'),current:[['Job status','Complete'],['Outstanding action','None']],communication:[['Channel','WhatsApp'],['Message status','Dispatch update recorded · demo']],events:'7 events →'}};
const order=['ready','quote-ready','quote-sent','accepted','payment','fulfilment','complete'];
const names=['Request','Quote ready','Quote sent','Accepted','Payment','Fulfilment','Complete'];
function goJobs(){location.href='../finance-operator-v2-customer-jobs-proof/'}
function life(i){return `<div class="lifecycle" role="img" aria-label="${steps[i]}, stage ${i+1} of 6">${steps.map((s,n)=>`<div class="life-step ${n<i?'done':''} ${n===i?'active':''}"><div class="life-dot">${n<i?'✓':n+1}</div><div class="life-label">${s}</div></div>`).join('')}</div>`}
function render(key){const s=states[key]||states.ready;document.getElementById('workspace').innerHTML=`<div class="page-head"><div class="page-kicker">Customer job</div><h1 class="page-title">Demo Customer A</h1><div class="page-ref">${s.ref}</div><div class="page-meta"><span>Preferred contact · WhatsApp</span><span>Handled by · Clint</span></div></div><div class="stage-line">${s.stage}</div>${life(s.idx)}<div class="record-layout"><div class="record-main"><div class="record-action">${s.action}</div><section class="record-section record-evidence"><div class="section-title"><h2>${s.mainTitle}</h2><span>${s.time}</span></div>${s.main}</section></div><div class="record-support"><section class="record-section"><div class="section-title"><h2>Customer communication</h2></div>${facts(s.communication)}</section></div><section class="record-section record-position"><div class="section-title"><h2>Current position</h2></div>${facts(s.current)}</section><section class="record-section record-history"><button class="panel history-link" type="button" data-demo-action="Conversation &amp; history"><strong>Conversation &amp; history</strong><span>${s.events}</span></button></section></div>`;document.getElementById('proof-switch').innerHTML=order.map((k,i)=>`<button type="button" data-state="${k}" class="${k===key?'active':''}" aria-pressed="${k===key}">${names[i]}</button>`).join('');document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{history.replaceState(null,'','#'+b.dataset.state);render(b.dataset.state)}));document.querySelectorAll('[data-demo-action]').forEach(b=>b.addEventListener('click',()=>showDemo(b.dataset.demoAction)));}
function showDemo(label){document.getElementById('dialog-title').textContent=label;document.getElementById('dialog-copy').textContent='This is an isolated visual preview. No message, quote, payment, stock or fulfilment change has been made.';const d=document.getElementById('proof-dialog');if(typeof d.showModal==='function')d.showModal();else window.alert(document.getElementById('dialog-copy').textContent)}
document.getElementById('dialog-close').addEventListener('click',()=>document.getElementById('proof-dialog').close());document.getElementById('proof-dialog').addEventListener('click',e=>{if(e.target.id==='proof-dialog')e.target.close()});
window.addEventListener('hashchange',()=>render(states[location.hash.slice(1)]?location.hash.slice(1):'ready'));
render(states[location.hash.slice(1)]?location.hash.slice(1):'ready');const saved=localStorage.getItem('px-v2-theme');if(saved)document.documentElement.dataset.theme=saved;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';
</script></body></html>
