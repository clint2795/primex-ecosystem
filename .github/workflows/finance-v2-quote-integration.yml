name: Finance v2 quote integration
on:
  pull_request:
    paths:
      - 'scripts/r5h-quote-*'
      - 'finance-operator-v2-job-ready-quote-proof/**'
      - 'finance-operator-layout-review/**'
      - '.github/workflows/finance-v2-quote-integration.yml'
  workflow_dispatch:
jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory existing Quote authority
        run: node scripts/r5h-quote-source-inventory.mjs
      - name: Quote adapter regressions
        run: node --test scripts/r5h-quote-adapter.test.mjs
      - name: Verify production isolation
        run: git diff --exit-code ${{ github.event.pull_request.base.sha }} HEAD -- finance/index.html finance/config.js finance-operator-layout-review/index.html
